[project]
name = "observability-test-app"
description = "Test app for observability stack with Prometheus, Alertmanager & Grafana"
authors = [{name="Jakub Płachecki", email="jakub@plachecki.dev"}]
license = "MIT"
readme = "README.md"
version = "1.0.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.162.0"
pydantic-settings = "^2.16.0"
uvicorn = "^0.54.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.3"
isort = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
