services:
  # Application Service
  app:
    build:
      context: ./observability-test-app
      dockerfile: Dockerfile
    image: observability-test-app:1.0.0
    container_name: observability-app
    # Application depends on monitoring services to see the availability of ping/health endpoints changes
    depends_on:
      prometheus:
        condition: service_healthy
      blackbox:
        condition: service_healthy
      alertmanager:
        condition: service_started
      grafana:
        condition: service_started
    restart: on-failure:5
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
          pids: 100   # max processes (CIS 5.29): memory and CPU limits do not stop a fork bomb
        reservations:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cap open file descriptors (OWASP Rule 7)
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    environment:
      - PYTHONUNBUFFERED=1
    # No healthcheck block: the image ships its own HEALTHCHECK (it uses Python, the image has no curl)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability-solution/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability-solution/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - monitoring

  # Blackbox Exporter
  blackbox:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    volumes:
      - ./observability-solution/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    ports:
      - "127.0.0.1:9115:9115"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - monitoring

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    volumes:
      - ./observability-solution/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}   # Set via environment variable
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability-solution/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:9001:3000"
    networks:
      - monitoring

volumes:
  grafana-data:

networks:
  monitoring:
    driver: bridge